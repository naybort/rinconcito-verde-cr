<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>Revisión responsive local</title><style>body{margin:0;padding:12px;background:#ddd;font:14px sans-serif}label{margin-right:16px}iframe{display:block;margin-top:12px;border:0;background:white}</style></head><body><label>Ancho <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select></label><label>Vista <select id="view"><option value="/#/plantas/demo-monstera">Monstera</option><option value="/#/plantas/sansevieria">Sansevieria</option><option value="/#/">Catálogo</option><option value="/tests/labels-browser.html">Etiquetas</option><option value="/tests/admin-collections-browser.html">Listados admin</option></select></label><label>Alto <select id="height"><option>900</option><option selected>2200</option></select></label><iframe title="Vista de prueba" width="390" height="2200" src="/#/plantas/demo-monstera"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.width=e.target.value;document.querySelector('#height').onchange=e=>frame.height=e.target.value;document.querySelector('#view').onchange=e=>frame.src=e.target.value;</script></body></html>
